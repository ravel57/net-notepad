spring:
  application:
    name: net-notepad
  sql:
    init:
      mode: always
  # Local database for development and tests; docker-compose.yaml overrides it with SPRING_DATASOURCE_* variables
  datasource:
    url: jdbc:postgresql://localhost:5432/netnotepad
    username: postgres
    password: postgres

netnotepad:
  # Maximum note length in characters
  max-note-length: 1000000
  # How long an unused note stays in memory after the last participant leaves
  idle-eviction: 60s

server:
  # Behind a reverse proxy: take scheme and client IP from X-Forwarded-* headers of trusted (private network) proxies.
  # Needed for the WebSocket same-origin check over HTTPS and for per-IP limits.
  forward-headers-strategy: native
  compression:
    enabled: true
  servlet:
    session:
      # Never put the session id into URLs: it holds the notes unlocked with a password
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
