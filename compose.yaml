# Full stack: docker compose up -d --build
name: net-notepad

services:
  app:
    build: .
    image: net-notepad:latest
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${POSTGRES_DB:-netnotepad}'
      SPRING_DATASOURCE_USERNAME: '${POSTGRES_USER:-netnotepad}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRES_PASSWORD:-netnotepad}'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: 'postgres:17-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-netnotepad}'
      POSTGRES_USER: '${POSTGRES_USER:-netnotepad}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-netnotepad}'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
