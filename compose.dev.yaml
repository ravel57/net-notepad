# Database for local development: started automatically by Spring Boot on `./gradlew bootRun` and in tests
name: net-notepad-dev

services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=netnotepad'
      - 'POSTGRES_USER=netnotepad'
      - 'POSTGRES_PASSWORD=netnotepad'
    ports:
      - '5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

volumes:
  pgdata:
